# release-plz configuration (manual workflow_dispatch only)
# Version upgrades and releases for `lazyaix/lazyagents` are triggered strictly when a maintainer
# manually creates and pushes a `vX.Y.Z` Git tag (handled by `.github/workflows/release.yml`).
# See https://release-plz.dev/docs/config

[workspace]
git_only = true
publish = false
git_release_enable = false
git_tag_enable = false
semver_check = false
pr_labels = ["release"]

[[package]]
name = "lazyagents"
git_release_enable = false
git_tag_enable = false
git_tag_name = "v{{ version }}"
changelog_path = "CHANGELOG.md"
changelog_include = [
  "la-core",
  "la-runtime",
  "la-tui",
]
