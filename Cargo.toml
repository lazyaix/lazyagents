[workspace]
resolver = "3"
members = [
    "crates/la-core",
    "crates/la-runtime",
    "crates/la-tui",
    "crates/la-cli",
]
default-members = ["crates/la-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/lazyaix/lazyagents"
authors = ["LazyAIX Contributors"]
keywords = ["ai", "agents", "tui", "cli", "ratatui"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
base64 = "0.23"
clap = { version = "4.6", features = ["derive"] }
color-eyre = "0.6"
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
globset = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
insta = "1.46"
la-core = { path = "crates/la-core", version = "0.1.0" }
la-runtime = { path = "crates/la-runtime", version = "0.1.0" }
la-tui = { path = "crates/la-tui", version = "0.1.0" }
minijinja = { version = "3.1", features = ["serde", "preserve_order"] }
notify-debouncer-mini = "0.7"
proptest = "1.10"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = { version = "0.30.1", default-features = false, features = ["all-widgets"] }
ratatui-image = { version = "11", default-features = false }
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
similar = "3.2"
syntect = { version = "5.2", default-features = false, features = ["default-fancy"] }
tachyonfx = { version = "0.25", default-features = false }
tempfile = "3.27"
terminal-colorsaurus = "1.0"
thiserror = "2.0"
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "1.2"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "registry"] }
tui-big-text = "0.8"
unicode-segmentation = "1.12"
unicode-width = "0.2"

[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Mutually exclusive with `rust.unreachable_pub = "warn"` on items in private modules.
redundant_pub_crate = "allow"

# TUI & Agent production safety red lines (test exemptions live in clippy.toml)
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "warn"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
await_holding_lock = "deny"

# Explicit safety, module hygiene, integer hygiene, and M-LINT-OVERRIDE-EXPECT enforcement
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
mod_module_files = "warn"
arithmetic_side_effects = "warn"
cast_lossless = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
indexing_slicing = "warn"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

[workspace.lints.cargo]
unused_dependencies = "warn"
