name: Feature Request
description: Propose a new feature or enhancement for lazyagents
title: "feat: "
labels:
  - "enhancement"
  - "triage"
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem or use case are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the API, CLI, or workflow behavior you envision.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative designs or workarounds you have considered.
    validations:
      required: false
